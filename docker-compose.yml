services:
  api:
    image: jagger911/finances-api:latest
    ports:
      - "9002:9002"
    environment:
      DATABASE_URL: postgres://finances:finances@db:5432/finances?sslmode=disable
      PORT: "9002"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: finances
      POSTGRES_DB: finances
    volumes:
      - finances-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  finances-pgdata:
